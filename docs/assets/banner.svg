<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="foundry-studio — Foundry 蛋白质设计工具包 Web 界面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="helix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <circle cx="1100" cy="80" r="260" fill="url(#glow)"/>
  <circle cx="180" cy="360" r="220" fill="url(#glow)"/>

  <!-- dotted grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <path d="M0 60 H1280 M0 120 H1280 M0 180 H1280 M0 240 H1280 M0 300 H1280 M0 360 H1280"/>
    <path d="M60 0 V420 M120 0 V420 M180 0 V420 M240 0 V420 M300 0 V420 M360 0 V420 M420 0 V420 M480 0 V420 M540 0 V420 M600 0 V420 M660 0 V420 M720 0 V420 M780 0 V420 M840 0 V420 M900 0 V420 M960 0 V420 M1020 0 V420 M1080 0 V420 M1140 0 V420 M1200 0 V420 M1260 0 V420"/>
  </g>

  <!-- DNA-like helix illustration (right) -->
  <g transform="translate(880, 60)">
    <path d="M0 300 C 60 240, 60 200, 0 140 S -60 40, 0 -20" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.9"/>
    <path d="M120 300 C 180 240, 180 200, 120 140 S 60 40, 120 -20" fill="none" stroke="#c084fc" stroke-width="3" opacity="0.9"/>
    <g stroke="#475569" stroke-width="2" opacity="0.8">
      <line x1="6" y1="266" x2="114" y2="266"/>
      <line x1="0" y1="225" x2="120" y2="225"/>
      <line x1="-6" y1="184" x2="126" y2="184"/>
      <line x1="0" y1="143" x2="120" y2="143"/>
      <line x1="6" y1="102" x2="114" y2="102"/>
      <line x1="0" y1="61" x2="120" y2="61"/>
      <line x1="-6" y1="20" x2="126" y2="20"/>
    </g>
    <circle cx="6" cy="266" r="5" fill="#38bdf8"/>
    <circle cx="114" cy="266" r="5" fill="#c084fc"/>
    <circle cx="-6" cy="184" r="5" fill="#38bdf8"/>
    <circle cx="126" cy="184" r="5" fill="#c084fc"/>
    <circle cx="6" cy="102" r="5" fill="#38bdf8"/>
    <circle cx="114" cy="102" r="5" fill="#c084fc"/>
    <circle cx="-6" cy="20" r="5" fill="#38bdf8"/>
    <circle cx="126" cy="20" r="5" fill="#c084fc"/>
  </g>

  <!-- small floating nodes -->
  <g fill="#818cf8" opacity="0.7">
    <circle cx="90" cy="90" r="6"/>
    <circle cx="720" cy="70" r="4"/>
    <circle cx="640" cy="360" r="5"/>
    <circle cx="1200" cy="330" r="4"/>
  </g>

  <!-- Title -->
  <text x="70" y="140" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="64" font-weight="800" fill="url(#accent)">foundry-studio</text>
  <text x="72" y="196" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#e2e8f0" letter-spacing="1">Foundry 蛋白质设计工具包 · 可视化 Web 界面</text>

  <!-- subtitle chips -->
  <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15">
    <rect x="70" y="228" rx="16" width="150" height="32" fill="#0ea5e9" opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="145" y="250" fill="#7dd3fc" text-anchor="middle">⚡ 异步任务队列</text>
    <rect x="236" y="228" rx="16" width="190" height="32" fill="#8b5cf6" opacity="0.15" stroke="#a78bfa" stroke-width="1"/>
    <text x="331" y="250" fill="#c4b5fd" text-anchor="middle">🧬 RFD3 · RF3 · MPNN</text>
    <rect x="442" y="228" rx="16" width="170" height="32" fill="#10b981" opacity="0.15" stroke="#34d399" stroke-width="1"/>
    <text x="527" y="250" fill="#6ee7b7" text-anchor="middle">🖥️ 3D 结构查看器</text>
    <rect x="628" y="228" rx="16" width="160" height="32" fill="#f59e0b" opacity="0.15" stroke="#fbbf24" stroke-width="1"/>
    <text x="708" y="250" fill="#fcd34d" text-anchor="middle">🌍 中 / EN / 日 / RU</text>
  </g>

  <text x="72" y="330" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#94a3b8">让蛋白质设计像点按钮一样简单 —— 本地运行 · 无需 Redis · 开箱即用</text>
  <text x="72" y="368" font-family="'Consolas', 'Courier New', monospace" font-size="15" fill="#64748b">pip install -e . &amp;&amp; foundry-studio serve   →   http://127.0.0.1:8765</text>
</svg>

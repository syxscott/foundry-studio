[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foundry-studio"
version = "0.1.0"
description = "Web UI for RosettaCommons Foundry protein design toolkit (RFD3 / RFD3NA / RF3 / ProteinMPNN). Supports zh / en / ja / ru."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Syxscott" }]
keywords = ["protein-design", "rfdiffusion", "rf3", "mpnn", "bioinformatics", "webui"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "anyio>=4.4",
    # Required by the in-app agent's OpenAI-compatible LLM provider
    # (foundry_studio.llm.providers.openai_compat). Imported lazily at
    # runtime, so a missing install only surfaces when the agent is
    # actually exercised — declare it here so plain `pip install -e .`
    # is enough to use the planner.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Extra for talking to a real Foundry installation (models + atomworks + torch).
foundry = [
    "rc-foundry[all]>=0.1",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
foundry-studio = "foundry_studio.cli:app"
foundry-mcp = "foundry_studio.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/foundry_studio"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["frontend", "node_modules", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
asyncio_mode = "auto"
